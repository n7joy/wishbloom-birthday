<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120817"><title>Birthday Surprise</title><link rel="stylesheet" href="/style.css"></head><body class="party"><div id="confetti"></div><main>
<section id="s1" class="scene active"><div class="balloon-field" id="balloons"></div><div class="eyebrow">TAP TO BEGIN</div><h1>Hey, <span id="hello"></span> 👋</h1><p>Someone made a little birthday world just for you.</p><button class="cta" id="begin">Open my surprise ✨</button></section>
<section id="s2" class="scene"><div class="eyebrow">POP THE BALLOONS</div><div class="balloons" id="pop"></div><h2>Pop them all!</h2><p id="popCount">0 / 6</p></section>
<section id="s3" class="scene"><div class="eyebrow">A LITTLE MEMORY</div><div class="gallery" id="gallery"></div><h2>Made with your memories.</h2><button class="ghost" id="memNext">Next →</button></section>
<section id="s4" class="scene"><div class="eyebrow">MAKE A WISH</div><div class="cake">🎂</div><div id="flame">🔥</div><h2>Close your eyes.<br>Make a wish.</h2><button class="cta" id="blow">Blow out the candles</button></section>
<section id="s5" class="scene"><article><div class="eyebrow">A LETTER FOR YOU</div><h2 id="title"></h2><p id="message"></p><strong id="from"></strong></article><div class="actions"><button class="cta" id="video">Create birthday video 🎬</button><button class="ghost" id="share">Share ↗</button></div><div id="videoBox"></div></section>
</main><script src="/card.js"></script></body></html>
